name: splitmate
description: "Group Expense Splitter - Split shared expenses with friends"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Google Maps
  google_maps_flutter: ^2.9.0

  # WebView
  webview_flutter: ^4.10.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2

  # State management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
