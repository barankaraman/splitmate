name: splitmate
description: "Group Expense Splitter - Split shared expenses with friends"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Google Maps
  google_maps_flutter: ^2.9.0

  # WebView
  webview_flutter: ^4.10.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.2

  # State management
  provider: ^6.1.2

  # Persistent storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5

  # URL Launcher (for directions)
  url_launcher: ^6.3.0

  # YAML parsing and editing
  yaml: ^3.1.2
  yaml_edit: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/credentials.yaml
